<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emploi du Temps</title>
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        #calendar {
            max-width: 900px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Emploi du Temps</h1>

    {{ emploi_du_temps }}
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek', // Affichage hebdomadaire
                slotDuration: '00:30:00',   // Tranches de 30 minutes
                allDaySlot: false,         // Désactiver l'affichage "toute la journée"
                events: {{ emploi_du_temps|tojson|safe }}, // Injecte les données JSON
                locale: 'fr',               // Langue française
                slotMinTime: "07:00:00",    // Début à 9h
                slotMaxTime: "18:00:00",    // Fin à 18h
                eventOverlap: true,         // Permet le chevauchement des cours
                height: "auto",             // Ajuste la hauteur automatique
                firstDay: 1,                // Début de la semaine le lundi
            });
            calendar.render();
        });
    </script>
</body>
</html>
