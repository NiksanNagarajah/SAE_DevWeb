<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un cours</title>
</head>
<body>
    <h1>Réserver un cours</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <div>
            <label for="cours">Cours :</label>
            {{ form.cours }}
        </div>
        <div>
            <label for="poney">Poney :</label>
            {{ form.poney }}
        </div>
        <div>
            {{ form.submit }}
        </div>
    </form>
</body>
</html>
